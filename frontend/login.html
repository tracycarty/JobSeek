<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeek - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1><span class="brand-mark">JS</span>JobSeek</h1>
    <p class="status">Sign in to continue your hiring or job search workspace.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit">Login</button>
    </form>
    <p id="error" class="status error"></p>
    <div class="auth-link">
      No account yet? <a href="register.html">Register</a>
    </div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorElement = document.getElementById("error");

      errorElement.textContent = "";

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorElement.textContent = data.message || "Login failed";
          return;
        }

        localStorage.setItem("token", data.access_token);
        localStorage.setItem("role", data.user.role);

        if (data.user.role === 'employee') {
          window.location.href = 'employers/dashboard.html';
        } else {
          window.location.href = 'applicants/jobs.html';
        }
      } catch (error) {
        errorElement.textContent = "Network error. Please try again.";
      }
    });
  </script>
</body>
</html>
