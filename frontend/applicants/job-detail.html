<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeek - Job Details</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="brand"><span class="brand-mark">JS</span>JobSeek</p>
        <p class="header-kicker">Applicant Workspace</p>
      </div>
      <div class="button-group">
        <a href="/applicants/jobs.html" class="view-link secondary-link">Browse Jobs</a>
        <a href="/applicants/applications.html" class="view-link">My Applications</a>
      </div>
    </div>
  </header>

  <main class="page-shell detail-page">
    <a class="back-link" href="/applicants/jobs.html">Back to jobs</a>
    <div id="content">
      <div class="loading">Loading job details...</div>
    </div>
  </main>

  <script>
    let currentJobId = null;

    async function loadJobDetails() {
      const content = document.getElementById('content');
      const urlParams = new URLSearchParams(window.location.search);
      const jobId = urlParams.get('id');

      if (!jobId || isNaN(jobId)) {
        content.innerHTML = '<div class="error">Invalid job ID</div>';
        return;
      }

      currentJobId = jobId;

      try {
        const token = localStorage.getItem('token');
        const headers = {};
        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const response = await fetch(`/jobs/${jobId}`, { headers });

        if (response.status === 401) {
          localStorage.removeItem('token');
          localStorage.removeItem('role');
          window.location.href = '/login.html';
          return;
        }

        if (response.status === 404) {
          content.innerHTML = '<div class="error">Job not found</div>';
          return;
        }

        if (!response.ok) {
          throw new Error('Failed to fetch job details');
        }

        const job = await response.json();
        renderJobDetails(job);
        checkApplicationStatus(jobId);
      } catch (error) {
        content.innerHTML = '<div class="error">Failed to load job details. Please try again.</div>';
      }
    }

    async function checkApplicationStatus(jobId) {
      try {
        const token = localStorage.getItem('token');
        if (!token) {
          return;
        }

        const response = await fetch('/applications/me', {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        if (!response.ok) {
          return;
        }

        const data = await response.json();
        const existingApplication = (data.data || []).find(
          (application) => application.jobId == jobId,
        );

        if (existingApplication) {
          const applyForm = document.getElementById('applyForm');
          if (applyForm) {
            applyForm.innerHTML = `
              <div class="success-message">
                You have already applied to this job.
                <div class="status-pill status-${existingApplication.status.toLowerCase()}">
                  Current status: ${escapeHtml(existingApplication.status)}
                </div>
              </div>
            `;
          }
        }
      } catch (error) {
        console.error('Failed to check application status:', error);
      }
    }

    function renderJobDetails(job) {
      const html = `
        <article class="job-detail always-visible">
          <div class="card-title-row">
            <div>
              <h1>${escapeHtml(job.title)}</h1>
              <p class="job-meta">${escapeHtml(job.company)} - ${escapeHtml(job.location)}</p>
            </div>
          </div>
          <p class="salary">${escapeHtml(job.salary || 'Salary not specified')}</p>
          <section>
            <h2>Job Description</h2>
            <p class="job-description">${escapeHtml(job.description).replace(/\n/g, '<br>')}</p>
          </section>
        </article>
      `;

      document.getElementById('content').innerHTML = html;

      const applySectionHtml = `
        <section class="apply-section dashboard-section">
          <div class="section-heading">
            <h2>Apply for this Job</h2>
            <p>Share your details and upload your resume to send your application.</p>
          </div>
          <div id="applyForm">
            <form id="applicationForm" class="form-grid">
              <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
              </div>

              <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number" required>
              </div>

              <div class="form-group wide">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" required>
              </div>

              <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="16" max="120" placeholder="Enter your age" required>
              </div>

              <div class="form-group">
                <label for="resume">Resume</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                <div class="help-text">PDF, DOC, or DOCX. Max 5MB.</div>
              </div>

              <div class="form-group wide">
                <label for="coverLetter">Cover Letter</label>
                <input type="file" id="coverLetter" name="coverLetter" accept=".pdf,.doc,.docx">
                <div class="help-text">Optional. PDF, DOC, or DOCX. Max 5MB.</div>
              </div>

              <div class="button-group">
                <button type="submit" class="apply-btn" id="submitBtn">Apply Now</button>
              </div>
              <div id="messageContainer"></div>
            </form>
          </div>
        </section>
      `;

      document.getElementById('content').innerHTML += applySectionHtml;

      const form = document.getElementById('applicationForm');
      if (form) {
        form.addEventListener('submit', handleApplicationSubmit);
      }
    }

    async function handleApplicationSubmit(event) {
      event.preventDefault();

      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const messageContainer = document.getElementById('messageContainer');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      messageContainer.innerHTML = '';

      try {
        const formData = new FormData();
        const fullName = document.getElementById('fullName').value.trim();
        const address = document.getElementById('address').value.trim();
        const age = document.getElementById('age').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();

        if (!fullName) {
          throw new Error('Full name is required');
        }

        if (!address) {
          throw new Error('Address is required');
        }

        if (!age) {
          throw new Error('Age is required');
        }

        if (!phoneNumber) {
          throw new Error('Phone number is required');
        }

        formData.append('jobId', currentJobId);
        formData.append('fullName', fullName);
        formData.append('address', address);
        formData.append('age', age);
        formData.append('phoneNumber', phoneNumber);

        const resumeFile = document.getElementById('resume').files[0];
        if (!resumeFile) {
          throw new Error('Resume is required');
        }
        formData.append('resume', resumeFile);

        const coverLetterFile = document.getElementById('coverLetter').files[0];
        if (coverLetterFile) {
          formData.append('coverLetter', coverLetterFile);
        }

        const response = await fetch('/applications', {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
          },
          body: formData,
        });

        if (response.status === 409) {
          messageContainer.innerHTML =
            '<div class="error-message">You have already applied to this job.</div>';
        } else if (response.status === 400) {
          const error = await response.json();
          const message = Array.isArray(error.message)
            ? error.message.join(', ')
            : error.message;
          messageContainer.innerHTML = `<div class="error-message">Error: ${escapeHtml(message)}</div>`;
        } else if (response.status === 401) {
          localStorage.removeItem('token');
          localStorage.removeItem('role');
          window.location.href = '/login.html';
          return;
        } else if (!response.ok) {
          throw new Error('Failed to submit application');
        } else {
          messageContainer.innerHTML =
            '<div class="success-message">Application submitted successfully.<div class="status-pill status-pending">Current status: PENDING</div></div>';
          document.getElementById('applicationForm').reset();
          submitBtn.style.display = 'none';
        }
      } catch (error) {
        messageContainer.innerHTML = `<div class="error-message">Error: ${escapeHtml(error.message)}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Apply Now';
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    } else {
      loadJobDetails();
    }
  </script>
</body>
</html>
