<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeek - Jobs</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="brand"><span class="brand-mark">JS</span>JobSeek</p>
        <p class="header-kicker">Applicant Workspace</p>
      </div>
      <form class="search-form" id="searchForm">
        <label class="sr-only" for="searchInput">Search jobs</label>
        <input type="text" id="searchInput" placeholder="Search by title, company, or location" value="">
        <button type="submit">Search</button>
      </form>
      <div class="header-actions">
        <a href="/applicants/applications.html" class="nav-btn">My Applications</a>
        <button class="logout-btn" type="button" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="list-heading">
      <h1>Find your next role</h1>
      <p>Browse open opportunities and keep track of jobs you have already applied for.</p>
    </section>

    <div id="content">
      <div class="loading">Loading jobs...</div>
    </div>
  </main>

  <script>
    let currentPage = 1;
    let currentQuery = '';
    let applicationStatusByJob = {};

    async function fetchJobs(page = 1, query = '') {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">Loading jobs...</div>';

      try {
        let url = `/jobs?page=${page}&limit=10`;
        if (query) {
          url = `/jobs/search?q=${encodeURIComponent(query)}&page=${page}&limit=10`;
        }

        const token = localStorage.getItem('token');
        const headers = {};
        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const [jobsResponse, applicationsResponse] = await Promise.all([
          fetch(url, { headers }),
          fetch('/applications/me?page=1&limit=100', { headers }),
        ]);

        if (jobsResponse.status === 401 || applicationsResponse.status === 401) {
          logout();
          return;
        }

        if (!jobsResponse.ok) {
          throw new Error('Failed to fetch jobs');
        }

        const jobsData = await jobsResponse.json();
        applicationStatusByJob = {};

        if (applicationsResponse.ok) {
          const applicationsData = await applicationsResponse.json();
          for (const application of applicationsData.data || []) {
            applicationStatusByJob[application.jobId] = application.status;
          }
        }

        renderJobs(jobsData);
      } catch (error) {
        content.innerHTML = '<div class="error">Failed to load jobs. Please try again.</div>';
      }
    }

    function renderJobs(data) {
      const { data: jobs, pagination } = data;

      if (!jobs || jobs.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty">No jobs found.</div>';
        return;
      }

      let html = '<div class="jobs-grid">';

      jobs.forEach((job) => {
        const applicationStatus = applicationStatusByJob[job.id];
        const applicationStatusHtml = applicationStatus
          ? `<span class="application-status status-${applicationStatus.toLowerCase()}">Application: ${escapeHtml(applicationStatus)}</span>`
          : '';

        html += `
          <article class="job-card">
            <div class="card-title-row">
              <h3>${escapeHtml(job.title)}</h3>
            </div>
            <p class="job-meta">${escapeHtml(job.company)} - ${escapeHtml(job.location)}</p>
            <p class="salary">${escapeHtml(job.salary || 'Salary not specified')}</p>
            ${applicationStatusHtml}
            <div class="button-group">
              <a class="view-link" href="job-detail.html?id=${job.id}">View Details</a>
            </div>
          </article>
        `;
      });

      html += '</div>';

      if (pagination.totalPages > 1) {
        html += '<div class="pagination">';

        if (pagination.page > 1) {
          html += `<a href="#" onclick="changePage(${pagination.page - 1}); return false;">Previous</a>`;
        }

        for (let i = Math.max(1, pagination.page - 2); i <= Math.min(pagination.totalPages, pagination.page + 2); i += 1) {
          const activeClass = i === pagination.page ? 'active' : '';
          html += `<a href="#" class="${activeClass}" onclick="changePage(${i}); return false;">${i}</a>`;
        }

        if (pagination.page < pagination.totalPages) {
          html += `<a href="#" onclick="changePage(${pagination.page + 1}); return false;">Next</a>`;
        }

        html += '</div>';
      }

      document.getElementById('content').innerHTML = html;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function changePage(page) {
      currentPage = page;
      fetchJobs(currentPage, currentQuery);
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/login.html';
    }

    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    } else {
      fetchJobs();

      document.getElementById('searchForm').addEventListener('submit', (event) => {
        event.preventDefault();
        currentQuery = document.getElementById('searchInput').value.trim();
        currentPage = 1;
        fetchJobs(currentPage, currentQuery);
      });
    }
  </script>
</body>
</html>
