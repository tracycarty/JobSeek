<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeek - My Applications</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="brand"><span class="brand-mark">JS</span>JobSeek</p>
        <p class="header-kicker">Applicant Workspace</p>
      </div>
      <div class="button-group">
        <a href="/applicants/jobs.html" class="nav-btn">Browse Jobs</a>
      </div>
    </div>
  </header>

  <main class="page-shell detail-page">
    <section class="list-heading">
      <h1>My Applications</h1>
      <p>Review the roles you applied to and follow each application status.</p>
    </section>

    <div id="content">
      <div class="loading">Loading your applications...</div>
    </div>
  </main>

  <script>
    let currentPage = 1;
    const pageSize = 10;

    async function loadApplications(page = 1) {
      const content = document.getElementById('content');
      const token = localStorage.getItem('token');

      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const response = await fetch(
          `/applications/me?page=${page}&limit=${pageSize}`,
          {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          },
        );

        if (response.status === 401) {
          localStorage.removeItem('token');
          localStorage.removeItem('role');
          window.location.href = '/login.html';
          return;
        }

        if (!response.ok) {
          throw new Error('Failed to load applications');
        }

        const data = await response.json();
        currentPage = page;
        renderApplications(data);
      } catch (error) {
        content.innerHTML = `<div class="error">Failed to load applications: ${escapeHtml(error.message)}</div>`;
      }
    }

    function renderApplications(data) {
      const content = document.getElementById('content');

      if (!data.data || data.data.length === 0) {
        content.innerHTML = '<div class="empty-state">You have not applied to any jobs yet.</div>';
        return;
      }

      const applicationsHtml = data.data.map((app) => {
        const statusClass = `status-${app.status.toLowerCase()}`;
        const appliedDate = new Date(app.appliedAt).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });

        return `
          <article class="application-card">
            <div class="card-title-row">
              <h3>${escapeHtml(app.jobTitle)}</h3>
              <span class="status-badge ${statusClass}">${escapeHtml(app.status)}</span>
            </div>
            <p class="application-meta">Applied: ${appliedDate}</p>
            <div class="button-group">
              <button class="view-btn" type="button" onclick="viewJobDetail(${app.jobId})">View Job</button>
            </div>
          </article>
        `;
      }).join('');

      let html = `<div class="applications-list">${applicationsHtml}</div>`;

      if (data.pagination && data.pagination.totalPages > 1) {
        html += '<div class="pagination">';

        if (currentPage > 1) {
          html += `<button type="button" onclick="loadApplications(${currentPage - 1})">Previous</button>`;
        }

        for (let i = 1; i <= data.pagination.totalPages; i += 1) {
          const activeClass = i === currentPage ? 'active' : '';
          html += `<button type="button" onclick="loadApplications(${i})" class="${activeClass}">${i}</button>`;
        }

        if (currentPage < data.pagination.totalPages) {
          html += `<button type="button" onclick="loadApplications(${currentPage + 1})">Next</button>`;
        }

        html += '</div>';
      }

      content.innerHTML = html;
    }

    function viewJobDetail(jobId) {
      window.location.href = `/applicants/job-detail.html?id=${jobId}`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
    } else {
      loadApplications(1);
    }
  </script>
</body>
</html>
