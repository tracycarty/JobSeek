<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobSeek</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">JobSeek</a>
        <form class="search-form" action="index.html" method="get" role="search">
          <label class="sr-only" for="search-input">Search jobs</label>
          <input id="search-input" name="q" type="search" placeholder="Search jobs..." />
          <button type="submit">Search</button>
        </form>
      </div>
    </header>

    <main class="page-shell" aria-live="polite">
      <section class="list-heading" aria-labelledby="jobs-heading">
        <h1 id="jobs-heading">Available Jobs</h1>
        <p id="result-summary"></p>
      </section>

      <div id="status" class="status" role="status">Loading jobs...</div>
      <section id="job-list" class="job-list" aria-label="Job listings"></section>
    </main>

    <footer class="pagination" aria-label="Pagination"></footer>

    <script src="script.js"></script>
  </body>
</html>
