<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeek - Employer Dashboard</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="brand">JobSeek</p>
        <p class="status">Employer Dashboard</p>
      </div>
      <div class="button-group">
        <a class="view-link" href="job-form.html">Post Job</a>
        <button class="view-link" type="button" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="list-heading">
      <h1>Your Job Postings</h1>
      <p>Review all posted jobs and their current status.</p>
    </section>

    <div id="statusMessage" class="status"></div>

    <div class="job-list" id="jobList">
      <div class="job-card">
        <h2>Loading jobs...</h2>
      </div>
    </div>
  </main>

  <script>
    async function fetchJobs() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const response = await fetch('/jobs/employer', {
        headers: {
          Authorization: `Bearer ${token}`,
        },
      });

      if (response.status === 401) {
        logout();
        return;
      }

      const result = await response.json();
      renderJobs(result);
    }

    function renderJobs(jobs) {
      const jobList = document.getElementById('jobList');
      if (!jobs || jobs.length === 0) {
        jobList.innerHTML = '<div class="job-card"><h2>No jobs found.</h2></div>';
        return;
      }

      jobList.innerHTML = jobs
        .map(
          (job) => `
          <div class="job-card">
            <h2>${job.title}</h2>
            <p class="job-meta">${job.company} · ${job.location}</p>
            <p class="salary">${job.salary || 'Salary not specified'}</p>
            <p class="status">Status: ${job.status}</p>
            <p class="posted-date">Posted: ${new Date(job.created_at).toLocaleDateString()}</p>
            <div class="button-group">
              <a class="view-link" href="job-form.html?id=${job.id}">Edit</a>
              <button class="view-link" type="button" onclick="deleteJob(${job.id})">Delete</button>
            </div>
          </div>
        `,
        )
        .join('');
    }

    async function deleteJob(jobId) {
      const token = localStorage.getItem('token');
      const response = await fetch(`/jobs/${jobId}`, {
        method: 'DELETE',
        headers: {
          Authorization: `Bearer ${token}`,
        },
      });

      if (response.ok) {
        fetchJobs();
      } else {
        document.getElementById('statusMessage').textContent = 'Failed to delete job.';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/login.html';
    }

    fetchJobs();
  </script>
</body>
</html>
