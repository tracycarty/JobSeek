<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeek - Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Create Account</h1>
    <p class="status">Choose your workspace and create your JobSeek profile.</p>
    <form id="registerForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" required>

      <label for="role">Role</label>
      <select id="role" required>
        <option value="">Choose a role...</option>
        <option value="applicant">Applicant - Looking for jobs</option>
        <option value="employee">Employee - Hiring for jobs</option>
      </select>

      <button type="submit">Create Account</button>
    </form>
    <p id="error" class="status error"></p>
    <div class="auth-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </main>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;
      const errorElement = document.getElementById("error");

      errorElement.textContent = "";

      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, role })
        });

        if (res.ok) {
          alert("Registration successful! Please login.");
          window.location.href = "login.html";
        } else {
          const data = await res.json();
          errorElement.textContent = data.message || "Registration failed";
        }
      } catch (error) {
        errorElement.textContent = "Network error. Please try again.";
      }
    });
  </script>
</body>
</html>
